<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="hub" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="40%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#c78a0a"/>
    </radialGradient>
  </defs>
  <!-- 深色圆角背景 -->
  <rect width="512" height="512" rx="96" fill="#14151f"/>
  <!-- 转盘阴影 -->
  <circle cx="256" cy="272" r="180" fill="#000" opacity="0.35"/>
  <!-- 转盘外圈 -->
  <circle cx="256" cy="264" r="180" fill="#2a2b3d"/>
  <!-- 6 个扇区 -->
  <g transform="translate(256,264)">
    <path d="M0,0 L0,-168 A168,168 0 0,1 145.5,-84 Z" fill="#FF6B6B"/>
    <path d="M0,0 L145.5,-84 A168,168 0 0,1 145.5,84 Z" fill="#FFD93D"/>
    <path d="M0,0 L145.5,84 A168,168 0 0,1 0,168 Z" fill="#6BCB77"/>
    <path d="M0,0 L0,168 A168,168 0 0,1 -145.5,84 Z" fill="#4D96FF"/>
    <path d="M0,0 L-145.5,84 A168,168 0 0,1 -145.5,-84 Z" fill="#B983FF"/>
    <path d="M0,0 L-145.5,-84 A168,168 0 0,1 0,-168 Z" fill="#FF9F45"/>
  </g>
  <!-- 中心金钮 -->
  <circle cx="256" cy="264" r="52" fill="url(#hub)" stroke="#8a6a00" stroke-width="3"/>
  <!-- 顶部红色指针 -->
  <path d="M256,48 L236,92 L276,92 Z" fill="#ff4757" stroke="#c0392b" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="256" cy="56" r="10" fill="#ff4757"/>
</svg>
